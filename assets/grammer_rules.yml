IDS: IDS,IDS|id
IDS_AND_LITRALS: IDS_AND_LITRALS,IDS_AND_LITRALS|id|string
MATH_OP: +|-|*|/
BOOL_OP: <|=

# expressions
MATH_EXPRESSION: MATH_EXPRESSION.MATH_OP.MATH_EXPRESSION|(MATH_EXPRESSION)|id|number
BOOL_EXPRESSION: MATH_EXPRESSION.BOOL_OP.MATH_EXPRESSION|(BOOL_EXPRESSION)

# statements
ASSIGNMENT: id:=MATH_EXPRESSION;
READ: read.IDS;
WRITE: write.IDS_AND_LITRALS;

# control statements
IF_THEN: if.BOOL_EXPRESSION.then.S.end;
IF_THEN_ELSE: if.BOOL_EXPRESSION.then.S.else.S.end;
REPEAT: repeat.S.until.BOOL_EXPRESSION;

# program
S: S.S|ASSIGNMENT|READ|WRITE|IF_THEN|IF_THEN_ELSE|REPEAT
