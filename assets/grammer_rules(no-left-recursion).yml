IDS: id.IDS`
IDS`: ,IDS.IDS`|empty
IDS_AND_LITRALS: id.IDS_AND_LITRALS`|string.IDS_AND_LITRALS`
IDS_AND_LITRALS`: ,IDS_AND_LITRALS.IDS_AND_LITRALS`|empty
MATH_OP: +|-|*|/
BOOL_OP: <|=

# expressions
MATH_EXPRESSION: (MATH_EXPRESSION).MATH_EXPRESSION`|id.MATH_EXPRESSION`|number.MATH_EXPRESSION`
MATH_EXPRESSION`: MATH_OP.MATH_EXPRESSION.MATH_EXPRESSION`|empty
BOOL_EXPRESSION: MATH_EXPRESSION.BOOL_OP.MATH_EXPRESSION|(BOOL_EXPRESSION)

# statemets
ASSIGNMENT: id:=MATH_EXPRESSION;
READ: read.IDS;
WRITE: write.IDS_AND_LITRALS;

# control statements
IF_THEN: if.BOOL_EXPRESSION.then.S.end;
IF_THEN_ELSE: if.BOOL_EXPRESSION.then.S.else.S.end;
REPEAT: repeat.S.until.BOOL_EXPRESSION;

# program
S: ASSIGNMENT.S`|READ.S`|WRITE.S`|IF_THEN.S`|IF_THEN_ELSE.S`|REPEAT.S`
S`: S.S`|empty
