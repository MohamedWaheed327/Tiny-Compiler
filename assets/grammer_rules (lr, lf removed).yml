OPERATION: plus_operator|minus_operator|multiply_operator|division_operator|less_than_operator|equal_to_operator

IDS: identifier.A
A: comma.IDS|empty
IDS_AND_LITRALS: identifier.B|string.B
B: comma.IDS_AND_LITRALS|empty
EXPRESSION: open_bracket_operator.EXPRESSION.close_bracket_operator.C|identifier.C|number.C
C: OPERATION.EXPRESSION.C|empty

ASSIGNMENT: identifier.assignment_operator.EXPRESSION.semicolon
READ: read_keyword.IDS.semicolon
WRITE: write_keyword.IDS_AND_LITRALS.semicolon

ELSE_OR_EMPTY: else_keyword.S|empty
IF: if_keyword.EXPRESSION.then_keyword.S.ELSE_OR_EMPTY.end_keyword.semicolon
REPEAT: repeat_keyword.S.until_keyword.EXPRESSION.semicolon
S: ASSIGNMENT.S|READ.S|WRITE.S|IF.S|REPEAT.S|empty
