MATH_OP: plus_operator|minus_operator|multiply_operator|division_operator
BOOL_OP: less_than_operator|equal_to_operator
IDS: IDS.comma.IDS|identifier
IDS_AND_LITRALS: IDS_AND_LITRALS.comma.IDS_AND_LITRALS|string|identifier

MATH_EXPRESSION: MATH_EXPRESSION.MATH_OP.MATH_EXPRESSION|open_bracket.MATH_EXPRESSION.close_bracket|identifier|number
BOOL_EXPRESSION: MATH_EXPRESSION.BOOL_OP.MATH_EXPRESSION|open_bracket.BOOL_EXPRESSION.close_bracket

ASSIGNMENT: identifier.assignment_operator.MATH_EXPRESSION.semicolon
READ: read_keyword.IDS.semicolon
WRITE: write_keyword.IDS_AND_LITRALS.semicolon

ELSE_OR_EMPTY: else_keyword.S|empty
IF: if_keyword.BOOL_EXPRESSION.then_keyword.S.ELSE_OR_EMPTY.end_keyword.semicolon
REPEAT: repeat_keyword.S.until_keyword.BOOL_EXPRESSION.semicolon
S: S.S|ASSIGNMENT|READ|WRITE|IF|REPEAT
